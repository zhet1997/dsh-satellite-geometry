<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>卫星几何工作台 · DSH</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9eef4;color:#18374e;font:14px system-ui,sans-serif}header{height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#132b40;color:#fff}header small{color:#b5c8da}main{height:calc(100vh - 44px);display:grid;grid-template-columns:minmax(360px,38%) 8px minmax(480px,1fr)}iframe{width:100%;height:100%;border:0;background:white}#divider{cursor:col-resize;background:#d2dde7;touch-action:none}#divider:hover{background:#8caec8}#mask{position:fixed;inset:44px 0 0;display:none;cursor:col-resize}button{border:1px solid #587288;background:#1c3e59;color:white;border-radius:5px;padding:4px 8px;cursor:pointer}#status{font-size:12px;color:#d2e4f2}@media(max-width:900px){main{grid-template-columns:360px 8px 540px;overflow-x:auto}}</style>
<header><strong>卫星几何工作台 <small>原生 DSH 对话 · 热设计建模</small></strong><span id="status">在左侧选择工作区或会话，再从三维视图带入组件。</span><button id="reset">恢复布局</button></header>
<main id="split"><iframe id="chat" title="原生 DSH 对话" src="/?satelliteWorkbench=1"></iframe><div id="divider" role="separator" aria-label="调整聊天与三维区域宽度" tabindex="0"></div><iframe id="viewer" title="卫星装配三维工作台" src="/satellite-geometry/viewer/?apiBase=%2Fapi%2Fcad"></iframe></main><div id="mask"></div>
<script>
const chat=document.getElementById('chat'),viewer=document.getElementById('viewer'),split=document.getElementById('split'),mask=document.getElementById('mask'),divider=document.getElementById('divider'),status=document.getElementById('status');let ready=false,pending=null,currentSession=null;
function width(x){split.style.gridTemplateColumns=Math.max(360,Math.min(x,innerWidth-420))+'px 8px minmax(420px,1fr)'}
divider.addEventListener('pointerdown',()=>{mask.style.display='block'});mask.addEventListener('pointermove',e=>width(e.clientX));mask.addEventListener('pointerup',()=>mask.style.display='none');divider.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){width(chat.getBoundingClientRect().width+(e.key==='ArrowLeft'?-30:30));e.preventDefault()}});document.getElementById('reset').onclick=()=>split.style.gridTemplateColumns='';
window.addEventListener('message',event=>{if(event.origin!==location.origin||!event.data||typeof event.data.type!=='string')return;const d=event.data;if(event.source===chat.contentWindow){if(d.type==='satellite-geometry:selection-result'){status.textContent=d.message;viewer.contentWindow.postMessage(d,location.origin);return}if(d.type==='satellite-geometry:chat-not-ready'){ready=false;return}if(d.type==='satellite-geometry:chat-ready'){ready=true;currentSession=d.sessionId;viewer.contentWindow.postMessage({type:'satellite-geometry:context',sessionId:currentSession},location.origin);status.textContent='选择组件后点击“带入聊天”，可在左侧编辑并发送。';if(pending){chat.contentWindow.postMessage(pending,location.origin);pending=null}return}}if(event.source!==viewer.contentWindow)return;if(d.type==='satellite-geometry:ready'){viewer.contentWindow.postMessage({type:'satellite-geometry:context',apiBase:'/api/cad',sessionId:currentSession},location.origin);return}if(['satellite-geometry:selection','satellite-geometry:ask-selection','satellite-geometry:run-workflow','satellite-geometry:bind-skill'].includes(d.type)){if(ready)chat.contentWindow.postMessage(d,location.origin);else if(d.type!=='satellite-geometry:selection'){pending=d;status.textContent='请先在左侧打开会话，所选上下文将自动带入草稿。'}}});
</script></html>
